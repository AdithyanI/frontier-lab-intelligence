{% extends "base.html" %}
{% block content %}
<article class="doc">
{{ body | safe }}
</article>
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  mermaid.initialize({
    startOnLoad: false,
    theme: "neutral",
    themeVariables: {
      primaryColor: "#eef1f4",
      primaryBorderColor: "#5b7d9e",
      primaryTextColor: "#2b3440",
      lineColor: "#5b7d9e",
      fontFamily: "Inter, system-ui, sans-serif",
      fontSize: "14px"
    }
  });
  // markdown renders fences as <pre class="mermaid"><code>…</code></pre>;
  // mermaid wants the raw text, so unwrap before running.
  document.querySelectorAll("pre.mermaid").forEach(pre => {
    const code = pre.querySelector("code");
    if (code) pre.textContent = code.textContent;
  });
  await mermaid.run({ querySelector: "pre.mermaid" });
</script>
{% endblock %}
