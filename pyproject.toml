[project]
name = "fli"
version = "0.1.0"
description = "Frontier Lab Intelligence — tracks frontier AI labs and key people, scores signal from their public output, delivers persona-tailored reports and alerts."
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "openai>=2.30,<3",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
fli = "fli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fli" = ["prompts/*.txt"]
"fli.web" = ["dist/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
