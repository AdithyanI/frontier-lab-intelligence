[project]
name = "fli"
version = "0.1.0"
description = "Frontier Lab Intelligence — tracks frontier AI labs and key people, scores signal from their public output, delivers persona-tailored reports and alerts."
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "httpx>=0.28,<1",
    "numpy>=2,<3",
    "openai>=2.30,<3",
    "pypdf>=6,<7",
    "tiktoken>=0.12,<1",
    "trafilatura>=2.1,<3",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
fli = "fli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fli.insights" = ["prompts/*.txt"]
"fli.registry" = ["prompts/*.txt"]
"fli.routing" = ["prompts/*.txt"]
"fli.web" = ["dist/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
